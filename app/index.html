<!-- Palm City Heat — a multi-panel cover maker. Every script, style,
     font, and image is a local file; the app makes zero network
     requests. Photos stay on this machine; nothing is uploaded. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm City Heat — Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Palm City Heat</h1>
    <p class="tagline">Turn a photo and a caption into a neon-sunset cover, offline.</p>
    <p class="hint">Your photos never leave this machine — everything renders in the browser.</p>

    <fieldset>
      <legend>Photos</legend>
      <div class="row">
        <button id="sample-boulevard" type="button">Load boulevard sample</button>
        <button id="sample-pier" type="button">Load pier sample</button>
      </div>
      <label>Photo 1 <input id="photo0" type="file" accept="image/*"></label>
      <label>Photo 2 <input id="photo1" type="file" accept="image/*"></label>
      <label>Photo 3 <input id="photo2" type="file" accept="image/*"></label>
    </fieldset>

    <fieldset>
      <legend>Layout &amp; grade</legend>
      <label>Layout <select id="layout"></select></label>
      <label>Grade <select id="grade"></select></label>
      <label>Size <select id="size"></select></label>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label>Caption <input id="caption" type="text" maxlength="40"></label>
      <label>Quote <input id="kicker" type="text" maxlength="40"></label>
      <label>Script line <input id="script" type="text" maxlength="40"></label>
      <label>Strip tagline <input id="strip" type="text" maxlength="60"></label>
      <label>City seed <input id="seed" type="number" min="0" max="99999"></label>
    </fieldset>

    <fieldset>
      <legend>Panel crop — hero photo</legend>
      <label>Zoom <input id="zoom0" type="range" min="0.5" max="2" step="0.05" value="1"></label>
      <label>Pan across <input id="panx0" type="range" min="-0.2" max="0.2" step="0.01" value="0"></label>
      <label>Pan down <input id="pany0" type="range" min="-0.2" max="0.2" step="0.01" value="0"></label>
    </fieldset>

    <fieldset>
      <legend>Panel crop — second photo</legend>
      <label>Zoom <input id="zoom1" type="range" min="0.5" max="2" step="0.05" value="1"></label>
      <label>Pan across <input id="panx1" type="range" min="-0.2" max="0.2" step="0.01" value="0"></label>
      <label>Pan down <input id="pany1" type="range" min="-0.2" max="0.2" step="0.01" value="0"></label>
    </fieldset>

    <div class="row">
      <button id="surprise" type="button">Surprise me</button>
      <button id="export" type="button">Export PNG</button>
      <button id="export-all" type="button">Export all sizes</button>
    </div>
    <p id="status" role="status"></p>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
    <p id="size-note"></p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
